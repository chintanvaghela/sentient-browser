[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentient-browser"
version = "0.1.0"
description = "Python client SDK for Sentient Browser AI Runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Sentient Browser Team" }
]
dependencies = [
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
